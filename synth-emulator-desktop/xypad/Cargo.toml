[package]
name = "helix-xypad"
version = "0.1.0"
edition = "2021"
description = "Touchpad as an XY pad: absolute finger position with cursor grab"
license = "MIT"

[lib]
name = "xypad"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_UI_Input",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
] }
