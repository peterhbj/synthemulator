[package]
name = "helix"
version = "0.1.0"
edition = "2021"
description = "Helix: synth and live remix desktop app for Linux and Windows"
license = "MIT"
default-run = "helix"

[workspace]
members = ["remix", "xypad"]

[dependencies]
helix-remix = { path = "remix" }
helix-xypad = { path = "xypad" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.16"
crossbeam-channel = "0.5"
eframe = { version = "0.32", default-features = true, features = ["wayland"] }
egui = "0.32"
midir = "0.10"
rustfft = "6.4"

[profile.release]
lto = true
codegen-units = 1
