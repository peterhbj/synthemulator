[package]
name = "helix"
version = "0.1.0"
edition = "2021"
description = "Native Linux desktop port of the Helix analog keyboard"
license = "MIT"
default-run = "helix"

[dependencies]
cpal = "0.16"
crossbeam-channel = "0.5"
eframe = { version = "0.32", default-features = true, features = ["wayland"] }
egui = "0.32"
midir = "0.10"

[profile.release]
lto = true
codegen-units = 1
