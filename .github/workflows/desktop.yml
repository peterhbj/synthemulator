name: desktop

on:
  push:
    paths:
      - "synth-emulator-desktop/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "synth-emulator-desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: synth-emulator-desktop

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin: helix
          - os: windows-latest
            bin: helix.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: synth-emulator-desktop
      - name: ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo test --workspace --release
      - run: cargo build --release
      - name: helix.exe must not need the VC++ runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $deps = & $dumpbin.FullName /dependents target\release\helix.exe | Out-String
          $deps
          if ($deps -match 'VCRUNTIME|api-ms-win-crt|MSVCP') { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: helix-${{ runner.os }}
          path: synth-emulator-desktop/target/release/${{ matrix.bin }}
